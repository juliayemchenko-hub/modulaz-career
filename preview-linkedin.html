<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LinkedIn karusel - Modulaz</title>
<style>
  @font-face { font-family:"Europa"; src:url("fonts/EuropaLight.ttf") format("truetype"); font-weight:300; font-display:swap; }
  @font-face { font-family:"Europa"; src:url("fonts/EuropaRegular.ttf") format("truetype"); font-weight:400; font-display:swap; }
  @font-face { font-family:"Europa"; src:url("fonts/EuropaBold.ttf") format("truetype"); font-weight:700; font-display:swap; }
  :root{ --mint:#bfffca; --mint-deep:#7CE08F; --f:"Europa",system-ui,sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--f);background:#333;display:flex;flex-direction:column;align-items:center;gap:30px;padding:30px}
  .hint{color:#ccc;font-size:14px;text-align:center;max-width:1080px;line-height:1.5}

  .slide{
    position:relative;width:1080px;height:1080px;overflow:hidden;background:#0a0a0a;
    background-size:cover;background-position:center;flex-shrink:0;
  }
  .slide::after{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.18) 100%),
               linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%);}
  .slide .inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:76px}
  .eyebrow{font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mint-deep)}
  .title{font-size:74px;font-weight:700;line-height:1.02;letter-spacing:-.02em;color:#fff;margin:18px 0 30px;max-width:18ch}
  .title.big{font-size:92px}
  .sub{font-size:34px;color:rgba(255,255,255,.9);font-weight:300;line-height:1.35;max-width:24ch;margin-top:6px}
  .chips{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
  .chip{border:1.5px solid rgba(255,255,255,.55);color:#fff;font-size:30px;padding:16px 26px;background:rgba(255,255,255,.08);backdrop-filter:blur(3px);line-height:1.2}
  .chip b{color:var(--mint-deep);font-weight:700}

  .logo{position:absolute;top:60px;left:76px;z-index:3;height:40px;width:auto}
  .pageno{position:absolute;top:64px;right:76px;z-index:3;color:#fff;font-size:24px;font-weight:700;letter-spacing:.08em;opacity:.85}
  .cta-url{font-size:34px;color:var(--mint-deep);font-weight:700;margin-top:8px}
  .swipe{position:absolute;bottom:76px;right:76px;z-index:3;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px;opacity:.9}
</style>
</head>
<body>
<div class="hint">LinkedIn karusel - 1080×1080. Skrolaj i napravi screenshot svakog slajda (ili ih izvezi). Tekstove i fotke slobodno mijenjamo.</div>
<div id="deck"></div>

<script>
const LOGO = "modulaz-logo-white.png";
const SLIDES = [
  {
    photo:"photos/grupna-fotografija-tim.jpg", page:"01",
    eyebrow:"Karijere · Modulaz Group",
    title:"Tražimo ljude koji žele <span style='color:var(--mint-deep)'>više</span>.",
    sub:"Pretvori svoj potencijal u stvaran utjecaj. Pridruži se Modulaz timu.",
    swipe:"Swipe →"
  },
  {
    photo:"photos/operater-hmi-panel.jpg", page:"02",
    eyebrow:"Donja Dubrava · Proizvodnja",
    title:"Suvremena proizvodnja",
    chips:["Njemačke linije i automatizacija","Klimatiziran, čist i siguran pogon","Zaštitna oprema i plaćene edukacije","Bez iskustva - uvodimo te korak po korak"]
  },
  {
    photo:"photos/ured-portret-muskarac.jpg", page:"03",
    eyebrow:"Zašto Modulaz",
    title:"Financijska sigurnost koja traje",
    chips:["Konkurentna plaća i nagrade","Božićnica i uskrsnica","Regres i naknada za godišnji","Ugovor na neodređeno"]
  },
  {
    photo:"photos/laboratorij-mjerenje.jpg", page:"04",
    eyebrow:"Rast",
    title:"Razvoj koji ima smisla",
    chips:["Napredovanje unutar tvrtke","Edukacije i certifikati","Međunarodne konferencije","Prelazak između timova i ureda"]
  },
  {
    photo:"photos/tim-sastanak.jpg", page:"05",
    eyebrow:"Život u Modulazu",
    title:"Posao blizu doma",
    chips:["Organiziran prijevoz iz Međimurja","Topli obrok","Sky Office ured u Zagrebu","Tim u kojem se ostaje"]
  },
  {
    photo:"photos/tvornica-panorama.jpg", page:"06",
    eyebrow:"Otvorene pozicije",
    title:"Javi se. <span style='color:var(--mint-deep)'>Bez kompliciranja.</span>",
    sub:"Forma traje 2 minute. CV i broj telefona - to je sve.",
    url:"careers.modulazgroup.com"
  }
];

document.getElementById("deck").innerHTML = SLIDES.map(s=>`
  <div class="slide" style="background-image:url('${s.photo}')">
    <img class="logo" src="${LOGO}" alt="Modulaz">
    <div class="pageno">${s.page} / 0${SLIDES.length}</div>
    <div class="inner">
      <div class="eyebrow">${s.eyebrow}</div>
      <div class="title ${s.sub?'big':''}">${s.title}</div>
      ${s.sub?`<div class="sub">${s.sub}</div>`:""}
      ${s.url?`<div class="cta-url">${s.url}</div>`:""}
      ${s.chips?`<div class="chips">${s.chips.map(c=>`<div class="chip">${c}</div>`).join("")}</div>`:""}
    </div>
    ${s.swipe?`<div class="swipe">${s.swipe}</div>`:""}
  </div>
`).join("");
</script>
</body>
</html>
